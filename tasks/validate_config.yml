---
- name: Fail if removed or unsafe Gluetun escape-hatch variables are defined
  ansible.builtin.fail:
    msg: >-
      The variable `{{ item }}` is not supported by this fail-closed role.
      Use one of the role's typed settings instead.
  when: "lookup('ansible.builtin.varnames', ('^' + item + '$'), wantlist=True) | length > 0"
  loop:
    - gluetun_container_additional_networks
    - gluetun_container_additional_networks_custom
    - gluetun_container_additional_volumes
    - gluetun_container_additional_volumes_custom
    - gluetun_container_extra_arguments
    - gluetun_container_extra_arguments_custom
    - gluetun_container_host_bind_ports
    - gluetun_control_server_auth_config_secret
    - gluetun_environment_variables_additional_variables
    - gluetun_firewall_custom_post_rules
    - gluetun_vpn_down_command
    - gluetun_vpn_up_command

- name: Fail if required Gluetun settings are not defined
  ansible.builtin.fail:
    msg: "You need to define a required configuration setting (`{{ item }}`)."
  when: "lookup('vars', item, default='') | string | length == 0"
  loop:
    - gluetun_identifier
    - gluetun_base_path
    - gluetun_data_path
    - gluetun_secrets_path
    - gluetun_uid
    - gluetun_gid
    - gluetun_container_image
    - gluetun_container_network
    - gluetun_vpn_service_provider
    - gluetun_vpn_type

- name: Validate Gluetun scalar and collection settings
  ansible.builtin.assert:
    that:
      - gluetun_identifier is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - gluetun_base_path is match('^/[a-zA-Z0-9_./-]+$')
      - "'..' not in gluetun_base_path.split('/')"
      - not gluetun_base_path.endswith('/')
      - gluetun_data_path == gluetun_base_path + '/data'
      - gluetun_secrets_path == gluetun_base_path + '/secrets'
      - gluetun_environment_file_path == gluetun_base_path + '/env'
      - gluetun_companion_resolv_conf_path == gluetun_base_path + '/companion-resolv.conf'
      - gluetun_uid | string is match('^[0-9]+$')
      - gluetun_gid | string is match('^[0-9]+$')
      - gluetun_arch in ['amd64', 'arm64']
      - gluetun_version == '3.41.2'
      - gluetun_container_image_tag == 'v3.41.2'
      - gluetun_container_image is match('^(?:[a-zA-Z0-9._:-]+/)*qmcgaw/gluetun:v3[.]41[.]2$')
      - gluetun_container_user == '0:0'
      - gluetun_container_network is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - gluetun_container_hostname is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - not gluetun_container_network_ipv6_enabled | bool
      - gluetun_vpn_type in ['openvpn', 'wireguard']
      - gluetun_vpn_provider_environment_variables_custom | type_debug == 'dict'
      - gluetun_dns_upstream_resolvers | type_debug == 'list'
      - gluetun_health_target_addresses | type_debug == 'list'
      - gluetun_health_icmp_target_ips | type_debug == 'list'
      - gluetun_firewall_input_ports | type_debug == 'list'
      - gluetun_protected_consumers_list | type_debug == 'list'
      - gluetun_systemd_dependent_services_list | type_debug == 'list'
      - gluetun_container_network_known_peer_containers_list | type_debug == 'list'
      - gluetun_container_capabilities | type_debug == 'list'
      - gluetun_secret_files | type_debug == 'list'
      - gluetun_container_health_startup_timeout_seconds | int > 0
      - gluetun_container_health_poll_interval_seconds | int > 0
      - >-
        gluetun_systemd_start_timeout_seconds | int
        >= (gluetun_container_cleanup_timeout_seconds | int)
        + (gluetun_container_health_startup_timeout_seconds | int)
        + 30
      - gluetun_systemd_dependent_services_list | length <= 1
      - gluetun_protected_consumers_list | length <= 1
      - >-
        gluetun_systemd_dependent_services_list
        ==
        gluetun_protected_consumers_list
        | map(attribute='systemd_service_name')
        | list
      - >-
        gluetun_systemd_dependent_services_list | unique | length
        == gluetun_systemd_dependent_services_list | length
      - >-
        gluetun_container_network_known_peer_containers_list | unique | length
        == gluetun_container_network_known_peer_containers_list | length
      - >-
        gluetun_firewall_input_ports | map('int') | unique | length
        == gluetun_firewall_input_ports | length
    fail_msg: One or more Gluetun settings has an invalid type, value, or format.

- name: Validate Gluetun protected-consumer definitions
  ansible.builtin.assert:
    that:
      - item | type_debug == 'dict'
      - item.keys() | sort == ['container_name', 'systemd_service_name']
      - item.container_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item.container_name != gluetun_identifier
      - item.systemd_service_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$')
      - item.systemd_service_name != gluetun_identifier + '.service'
    fail_msg: >-
      Each protected consumer must contain only a safe container_name and
      systemd_service_name, and cannot name the Gluetun owner itself.
  loop: "{{ gluetun_protected_consumers_list }}"

- name: Validate unique Gluetun protected-consumer identities
  ansible.builtin.assert:
    that:
      - >-
        gluetun_protected_consumers_list
        | map(attribute='container_name')
        | unique
        | length
        == gluetun_protected_consumers_list | length
      - >-
        gluetun_protected_consumers_list
        | map(attribute='systemd_service_name')
        | unique
        | length
        == gluetun_protected_consumers_list | length
    fail_msg: Protected consumer container and systemd service names must be unique.

- name: Validate the immutable Gluetun fail-closed settings
  ansible.builtin.assert:
    that:
      - gluetun_firewall_enabled | bool
      - gluetun_firewall_vpn_input_ports | length == 0
      - gluetun_firewall_outbound_subnets | length == 0
      - gluetun_dns_server_enabled | bool
      - gluetun_dns_address == '127.0.0.1'
      - not gluetun_dns_keep_nameserver | bool
      - not gluetun_dns_upstream_ipv6_enabled | bool
      - gluetun_health_restart_vpn_enabled | bool
      - gluetun_control_server_address == '127.0.0.1:8000'
      - gluetun_control_server_auth_default_role == '{}'
      - not gluetun_http_proxy_enabled | bool
      - not gluetun_shadowsocks_enabled | bool
      - not gluetun_vpn_port_forwarding_enabled | bool
      - not gluetun_pprof_enabled | bool
      - >-
        (gluetun_container_capabilities | sort)
        ==
        ([
          'AUDIT_WRITE',
          'CHOWN',
          'DAC_OVERRIDE',
          'FOWNER',
          'FSETID',
          'KILL',
          'MKNOD',
          'NET_ADMIN',
          'NET_BIND_SERVICE',
          'NET_RAW',
          'SETFCAP',
          'SETGID',
          'SETPCAP',
          'SETUID',
          'SYS_CHROOT'
        ] | sort)
    fail_msg: >-
      The requested configuration weakens the role's fail-closed security
      contract and is not supported.

- name: Validate explicitly allowed local Gluetun ingress ports
  ansible.builtin.assert:
    that:
      - item | string is match('^[0-9]+$')
      - (item | int) >= 1
      - (item | int) <= 65535
      - (item | int) not in [53, 8000, 9999]
    fail_msg: >-
      Gluetun local ingress ports must be unique integers from 1 through
      65535 and cannot collide with the role-owned DNS, control, or health
      listeners (53, 8000, and 9999).
  loop: "{{ gluetun_firewall_input_ports }}"

- name: Validate Gluetun encrypted DNS settings
  ansible.builtin.assert:
    that:
      - gluetun_dns_upstream_resolver_type in ['dot', 'doh']
      - gluetun_dns_upstream_resolvers | length > 0
      - gluetun_dns_upstream_resolvers | difference(gluetun_dns_upstream_resolver_names_allowed) | length == 0
    fail_msg: Gluetun DNS must use one or more supported encrypted resolvers.

- name: Validate Gluetun provider environment variable names
  ansible.builtin.assert:
    that:
      - >-
        (gluetun_vpn_provider_environment_variable_names_allowed | sort)
        ==
        ([
          'FREE_ONLY',
          'ISP',
          'MULTIHOP_ONLY',
          'OPENVPN_AUTH',
          'OPENVPN_CIPHERS',
          'OPENVPN_ENDPOINT_IP',
          'OPENVPN_ENDPOINT_PORT',
          'OPENVPN_MSSFIX',
          'OPENVPN_PROTOCOL',
          'OPENVPN_VERBOSITY',
          'OWNED_ONLY',
          'PORT_FORWARD_ONLY',
          'PREMIUM_ONLY',
          'SECURE_CORE_ONLY',
          'SERVER_CATEGORIES',
          'SERVER_CITIES',
          'SERVER_COUNTRIES',
          'SERVER_HOSTNAMES',
          'SERVER_NAMES',
          'SERVER_NUMBER',
          'SERVER_REGIONS',
          'STREAM_ONLY',
          'TOR_ONLY',
          'WIREGUARD_ENDPOINT_IP',
          'WIREGUARD_ENDPOINT_PORT',
          'WIREGUARD_IMPLEMENTATION',
          'WIREGUARD_MTU',
          'WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL',
          'WIREGUARD_PUBLIC_KEY'
        ] | sort)
      - gluetun_vpn_provider_environment_variables_custom.keys() | difference(gluetun_vpn_provider_environment_variable_names_allowed) | length == 0
    fail_msg: >-
      gluetun_vpn_provider_environment_variables_custom contains an
      unsupported, secret-bearing, or enforcement-owned key.

- name: Reject multiline Gluetun provider environment variable values
  ansible.builtin.fail:
    msg: Gluetun provider environment variable values must be single-line scalars.
  when: "'\n' in (item.value | string) or '\r' in (item.value | string)"
  loop: "{{ gluetun_vpn_provider_environment_variables_custom | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Reject multiline Gluetun environment values
  ansible.builtin.fail:
    msg: Gluetun environment values must be single-line scalars.
  when: "'\n' in (item | string) or '\r' in (item | string)"
  loop: >-
    {{
      [gluetun_vpn_service_provider, gluetun_environment_variables_tz]
      + gluetun_dns_upstream_resolvers
      + gluetun_health_target_addresses
      + gluetun_health_icmp_target_ips
    }}

- name: Validate Gluetun systemd dependent service names
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$')
      - item != gluetun_identifier + '.service'
    fail_msg: A Gluetun dependent service name is invalid.
  loop: "{{ gluetun_systemd_dependent_services_list }}"

- name: Validate Gluetun known network peer container names
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item != gluetun_identifier
    fail_msg: A Gluetun known network peer container name is invalid.
  loop: "{{ gluetun_container_network_known_peer_containers_list }}"

- name: Validate paired OpenVPN username and password secrets
  ansible.builtin.assert:
    that:
      - (gluetun_openvpn_user_secret | length > 0) == (gluetun_openvpn_password_secret | length > 0)
    fail_msg: OpenVPN username and password secrets must be supplied together.
  no_log: true

- name: Validate paired OpenVPN certificate and key secrets
  ansible.builtin.assert:
    that:
      - (gluetun_openvpn_client_certificate_secret | length > 0) == (gluetun_openvpn_client_key_secret | length > 0)
    fail_msg: OpenVPN client certificate and key secrets must be supplied together.
  no_log: true

- name: Validate paired OpenVPN encrypted-key and passphrase secrets
  ansible.builtin.assert:
    that:
      - (gluetun_openvpn_encrypted_key_secret | length > 0) == (gluetun_openvpn_key_passphrase_secret | length > 0)
    fail_msg: OpenVPN encrypted-key and passphrase secrets must be supplied together.
  no_log: true

- name: Validate derived Gluetun secret-file inputs
  ansible.builtin.assert:
    that:
      - gluetun_secret_files == gluetun_secret_files_auto
      - >-
        (gluetun_secret_file_names_known | sort)
        ==
        ([
          'openvpn_clientcrt',
          'openvpn_clientkey',
          'openvpn_custom_config',
          'openvpn_encrypted_key',
          'openvpn_key_passphrase',
          'openvpn_password',
          'openvpn_user',
          'wg0.conf',
          'wireguard_addresses',
          'wireguard_preshared_key',
          'wireguard_private_key'
        ] | sort)
    fail_msg: Gluetun secret-file metadata is role-owned and cannot be overridden.
  no_log: true

- name: Reject OpenVPN secrets for a WireGuard configuration
  ansible.builtin.assert:
    that:
      - gluetun_openvpn_user_secret | length == 0
      - gluetun_openvpn_password_secret | length == 0
      - gluetun_openvpn_client_certificate_secret | length == 0
      - gluetun_openvpn_client_key_secret | length == 0
      - gluetun_openvpn_encrypted_key_secret | length == 0
      - gluetun_openvpn_key_passphrase_secret | length == 0
      - gluetun_openvpn_custom_configuration_secret | length == 0
    fail_msg: OpenVPN secrets cannot be used when gluetun_vpn_type is wireguard.
  when: gluetun_vpn_type == 'wireguard'
  no_log: true

- name: Reject WireGuard secrets for an OpenVPN configuration
  ansible.builtin.assert:
    that:
      - gluetun_wireguard_configuration_secret | length == 0
      - gluetun_wireguard_private_key_secret | length == 0
      - gluetun_wireguard_preshared_key_secret | length == 0
      - gluetun_wireguard_addresses_secret | length == 0
    fail_msg: WireGuard secrets cannot be used when gluetun_vpn_type is openvpn.
  when: gluetun_vpn_type == 'openvpn'
  no_log: true

- name: Validate full WireGuard configuration exclusivity
  ansible.builtin.assert:
    that:
      - gluetun_wireguard_private_key_secret | length == 0
      - gluetun_wireguard_preshared_key_secret | length == 0
      - gluetun_wireguard_addresses_secret | length == 0
      - >-
        gluetun_vpn_provider_environment_variables_custom.keys()
        | select('match', '^WIREGUARD_')
        | list
        | length == 0
    fail_msg: >-
      A full WireGuard configuration cannot be combined with discrete
      WireGuard settings because the file takes precedence upstream.
  when: gluetun_wireguard_configuration_secret | length > 0
  no_log: true

- name: Require discrete WireGuard credentials when no full configuration is supplied
  ansible.builtin.assert:
    that:
      - gluetun_wireguard_private_key_secret | length > 0
      - gluetun_wireguard_addresses_secret | length > 0
    fail_msg: >-
      WireGuard requires either a full configuration or both a private-key
      secret and an addresses secret.
  when:
    - gluetun_vpn_type == 'wireguard'
    - gluetun_wireguard_configuration_secret | length == 0
  no_log: true

- name: Check the Gluetun TUN device
  ansible.builtin.stat:
    path: "{{ gluetun_container_tun_device_path }}"
  register: gluetun_tun_device_stat

- name: Fail if the Gluetun TUN device is unavailable
  ansible.builtin.fail:
    msg: >-
      Gluetun requires a character device at
      `{{ gluetun_container_tun_device_path }}`.
  when: >-
    not gluetun_tun_device_stat.stat.exists
    or not (gluetun_tun_device_stat.stat.ischr | default(false))
