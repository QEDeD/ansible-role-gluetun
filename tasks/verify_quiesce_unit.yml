---
- name: Inspect the effective Gluetun load state while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=LoadState
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_load_state_result
  changed_when: false

- name: Inspect the effective Gluetun fragment path while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=FragmentPath
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_fragment_path_result
  changed_when: false

- name: Inspect the effective Gluetun service type while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=Type
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_service_type_result
  changed_when: false

- name: Inspect the effective Gluetun restart policy while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=Restart
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_restart_policy_result
  changed_when: false

- name: Inspect the effective Gluetun forced restart statuses while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RestartForceExitStatus
      - --property=RestartPreventExitStatus
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_restart_statuses_result
  changed_when: false

- name: Inspect the effective Gluetun manual-start policy while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RefuseManualStart
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_manual_start_policy_result
  changed_when: false

- name: Inspect the effective Gluetun manual-stop policy while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RefuseManualStop
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_manual_stop_policy_result
  changed_when: false

- name: Inspect the effective Gluetun drop-in paths while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=DropInPaths
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_dropin_paths_result
  changed_when: false

- name: Inspect the effective Gluetun start command while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStart
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_start_command_result
  changed_when: false

- name: Inspect the effective Gluetun stop commands while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStop
      - --property=ExecStopPost
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_stop_commands_result
  changed_when: false

- name: Inspect other effective Gluetun lifecycle commands while quiesced
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecCondition
      - --property=ExecStartPre
      - --property=ExecStartPost
      - --property=ExecReload
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_restored_quiesce_other_commands_result
  changed_when: false

- name: Prove the effective Gluetun unit is exactly quiesced
  vars:
    gluetun_restored_quiesce_unit_path: >-
      {{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service
    gluetun_restored_quiesce_dropin_path: >-
      /etc/systemd/system/{{ gluetun_identifier }}.service.d/zzzz-mash-fail-closed-quiesce.conf
  ansible.builtin.assert:
    that:
      - gluetun_restored_quiesce_load_state_result.stdout | trim == 'loaded'
      - >-
        gluetun_restored_quiesce_fragment_path_result.stdout
        | trim
        == gluetun_restored_quiesce_unit_path
      - gluetun_restored_quiesce_service_type_result.stdout | trim == 'simple'
      - gluetun_restored_quiesce_restart_policy_result.stdout | trim == 'no'
      - >-
        gluetun_restored_quiesce_restart_statuses_result.stdout
        | trim
        | length
        == 0
      - >-
        gluetun_restored_quiesce_manual_start_policy_result.stdout
        | trim
        == 'yes'
      - gluetun_restored_quiesce_manual_stop_policy_result.stdout | trim == 'no'
      - >-
        gluetun_restored_quiesce_dropin_paths_result.stdout.split()
        == [gluetun_restored_quiesce_dropin_path]
      - >-
        (
          gluetun_restored_quiesce_start_command_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == ['/bin/false']
      - >-
        (
          gluetun_restored_quiesce_stop_commands_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == ['/bin/true']
      - >-
        (
          gluetun_restored_quiesce_other_commands_result.stdout
          | regex_findall('path=([^ ;}]+)')
          | length
        )
        == 0
    fail_msg: >-
      The restored Gluetun unit did not adopt the exact inert, non-restarting,
      single-drop-in lifecycle contract.
