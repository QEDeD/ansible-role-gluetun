---
- name: Inspect the finalized Gluetun unit file
  ansible.builtin.stat:
    path: >-
      {{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service
    follow: false
  register: gluetun_final_unit_stat

- name: Require the finalized Gluetun unit to be a real file
  ansible.builtin.assert:
    that:
      - gluetun_final_unit_stat.stat.exists | bool
      - gluetun_final_unit_stat.stat.isreg | bool
      - not gluetun_final_unit_stat.stat.islnk | default(false) | bool
    fail_msg: >-
      The finalized Gluetun unit is absent or is not a real file. The persistent
      quiesce will be restored.

- name: Inspect the finalized Gluetun load state
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=LoadState
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_load_state_result
  changed_when: false

- name: Inspect the finalized Gluetun fragment path
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=FragmentPath
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_fragment_path_result
  changed_when: false

- name: Inspect the finalized Gluetun service type
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=Type
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_service_type_result
  changed_when: false

- name: Inspect the finalized Gluetun restart policy
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=Restart
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_restart_policy_result
  changed_when: false

- name: Inspect the finalized Gluetun forced restart statuses
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RestartForceExitStatus
      - --property=RestartPreventExitStatus
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_restart_statuses_result
  changed_when: false

- name: Inspect the finalized Gluetun manual-start policy
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RefuseManualStart
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_manual_start_policy_result
  changed_when: false

- name: Inspect the finalized Gluetun manual-stop policy
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RefuseManualStop
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_manual_stop_policy_result
  changed_when: false

- name: Inspect the finalized Gluetun drop-in paths
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=DropInPaths
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_dropin_paths_result
  changed_when: false

- name: Inspect the finalized Gluetun runtime directory
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RuntimeDirectory
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_runtime_directory_result
  changed_when: false

- name: Inspect the finalized Gluetun runtime-directory mode
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=RuntimeDirectoryMode
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_runtime_directory_mode_result
  changed_when: false

- name: Inspect the finalized Gluetun pre-start commands
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStartPre
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_pre_start_commands_result
  changed_when: false

- name: Inspect the finalized Gluetun start command
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStart
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_start_command_result
  changed_when: false

- name: Inspect the finalized Gluetun post-start command
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStartPost
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_post_start_command_result
  changed_when: false

- name: Inspect the finalized Gluetun stop command
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStop
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_stop_command_result
  changed_when: false

- name: Inspect the finalized Gluetun post-stop command
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecStopPost
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_post_stop_command_result
  changed_when: false

- name: Inspect other finalized Gluetun lifecycle commands
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - show
      - --property=ExecCondition
      - --property=ExecReload
      - --value
      - "{{ gluetun_identifier }}.service"
  register: gluetun_final_other_commands_result
  changed_when: false

- name: Prove the finalized Gluetun unit has the exact intended lifecycle
  vars:
    gluetun_final_unit_path: >-
      {{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service
    gluetun_final_helper_path: "{{ gluetun_container_helper_path }}"
    gluetun_final_expected_pre_start_argv:
      - "{{ gluetun_final_helper_path }} cleanup"
      - "{{ gluetun_final_helper_path }} create"
    gluetun_final_expected_start_argv: "{{ gluetun_final_helper_path }} start"
    gluetun_final_expected_post_start_argv: "{{ gluetun_final_helper_path }} health"
    gluetun_final_expected_stop_argv: "{{ gluetun_final_helper_path }} stop"
    gluetun_final_expected_post_stop_argv: "{{ gluetun_final_helper_path }} cleanup"
  ansible.builtin.assert:
    that:
      - gluetun_final_load_state_result.stdout | trim == 'loaded'
      - >-
        gluetun_final_fragment_path_result.stdout
        | trim
        == gluetun_final_unit_path
      - gluetun_final_service_type_result.stdout | trim == 'simple'
      - gluetun_final_restart_policy_result.stdout | trim == 'always'
      - gluetun_final_restart_statuses_result.stdout | trim | length == 0
      - gluetun_final_manual_start_policy_result.stdout | trim == 'no'
      - gluetun_final_manual_stop_policy_result.stdout | trim == 'no'
      - gluetun_final_dropin_paths_result.stdout | trim | length == 0
      - >-
        gluetun_final_runtime_directory_result.stdout
        | trim
        == gluetun_identifier + '-container'
      - gluetun_final_runtime_directory_mode_result.stdout | trim == '0700'
      - >-
        (
          gluetun_final_pre_start_commands_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == [gluetun_final_helper_path, gluetun_final_helper_path]
      - >-
        (
          gluetun_final_pre_start_commands_result.stdout
          | regex_findall('argv\\[\\]=([^;]+?)\\s*;')
          | map('trim')
          | list
        )
        == gluetun_final_expected_pre_start_argv
      - >-
        (
          gluetun_final_start_command_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == [gluetun_final_helper_path]
      - >-
        (
          gluetun_final_start_command_result.stdout
          | regex_findall('argv\\[\\]=([^;]+?)\\s*;')
          | map('trim')
          | list
        )
        == [gluetun_final_expected_start_argv]
      - >-
        (
          gluetun_final_post_start_command_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == [gluetun_final_helper_path]
      - >-
        (
          gluetun_final_post_start_command_result.stdout
          | regex_findall('argv\\[\\]=([^;]+?)\\s*;')
          | map('trim')
          | list
        )
        == [gluetun_final_expected_post_start_argv]
      - >-
        (
          gluetun_final_stop_command_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == [gluetun_final_helper_path]
      - >-
        (
          gluetun_final_stop_command_result.stdout
          | regex_findall('argv\\[\\]=([^;]+?)\\s*;')
          | map('trim')
          | list
        )
        == [gluetun_final_expected_stop_argv]
      - >-
        (
          gluetun_final_post_stop_command_result.stdout
          | regex_findall('path=([^ ;}]+)')
        )
        == [gluetun_final_helper_path]
      - >-
        (
          gluetun_final_post_stop_command_result.stdout
          | regex_findall('argv\\[\\]=([^;]+?)\\s*;')
          | map('trim')
          | list
        )
        == [gluetun_final_expected_post_stop_argv]
      - >-
        (
          gluetun_final_other_commands_result.stdout
          | regex_findall('path=([^ ;}]+)')
          | length
        )
        == 0
    fail_msg: >-
      The effective finalized Gluetun unit does not exactly match the intended
      fail-closed owner lifecycle. The persistent quiesce will be restored.
