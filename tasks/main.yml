---
- name: Perform Gluetun installation tasks
  when: gluetun_enabled | bool
  tags:
    - setup-all
    - setup-gluetun
    - install-all
    - install-gluetun
  block:
    - name: Validate Gluetun configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"

    - name: Validate Gluetun lifecycle mutation safety
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_lifecycle.yml"

    - name: Install Gluetun
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Gluetun uninstallation tasks
  when: not gluetun_enabled | bool
  tags:
    - setup-all
    - setup-gluetun
  block:
    - name: Validate Gluetun lifecycle cleanup safety
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_lifecycle.yml"

    - name: Uninstall Gluetun
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
