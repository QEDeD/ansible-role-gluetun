---
- name: Initialize Gluetun pre-mutation state
  ansible.builtin.set_fact:
    gluetun_existing_owner_container_id: ""
    gluetun_existing_owner_container_id_candidate: ""
    gluetun_existing_owner_container_inspect: {}
    gluetun_expected_container_image_id: ""
    gluetun_existing_owner_container_owned: false
    gluetun_existing_owner_container_contract_valid: false
    gluetun_existing_owner_requires_replacement: false
    gluetun_existing_owner_is_running: false
    gluetun_existing_owner_sandbox_id: ""
    gluetun_existing_protected_consumers_list: []
    gluetun_configured_consumer_container_ids_list: []
    gluetun_protected_consumer_resolved_ids_by_name: {}
    gluetun_protected_consumers_requiring_isolation_list: []
    gluetun_pre_mutation_ambiguity_messages_list: []
    gluetun_running_namespace_consumers_list: []

- name: Query the pinned local Gluetun image content identity
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - image
      - inspect
      - "--format={{ '{{' }}.Id{{ '}}' }}"
      - "{{ gluetun_container_image }}"
  register: gluetun_expected_container_image_query_result
  changed_when: false
  failed_when: false

- name: Record the pinned local Gluetun image content identity
  ansible.builtin.set_fact:
    gluetun_expected_container_image_id: >-
      {{ gluetun_expected_container_image_query_result.stdout | trim }}
  when:
    - gluetun_expected_container_image_query_result.rc == 0
    - gluetun_expected_container_image_query_result.stdout_lines | length == 1
    - >-
      gluetun_expected_container_image_query_result.stdout
      | trim
      is match('^sha256:[a-f0-9]{64}$')

- name: Query the current Gluetun owner container
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --all --no-trunc --quiet
      --filter 'name=^/{{ gluetun_identifier | regex_escape }}$'
  register: gluetun_existing_owner_container_query_result
  changed_when: false
  failed_when: false

- name: Record an ambiguous current Gluetun owner query
  ansible.builtin.set_fact:
    gluetun_pre_mutation_ambiguity_messages_list: >-
      {{
        gluetun_pre_mutation_ambiguity_messages_list
        + ['The exact-name Gluetun owner query was ambiguous.']
      }}
  when: >-
    gluetun_existing_owner_container_query_result.rc != 0
    or
    (
      gluetun_existing_owner_container_query_result.stdout | trim | length > 0
      and
      (
        gluetun_existing_owner_container_query_result.stdout_lines | length != 1
        or
        gluetun_existing_owner_container_query_result.stdout_lines[0]
        is not match('^[a-f0-9]{64}$')
      )
    )

- name: Record the current Gluetun owner container ID candidate
  ansible.builtin.set_fact:
    gluetun_existing_owner_container_id_candidate: >-
      {{ gluetun_existing_owner_container_query_result.stdout_lines[0] }}
  when:
    - gluetun_existing_owner_container_query_result.rc == 0
    - gluetun_existing_owner_container_query_result.stdout_lines | length == 1
    - gluetun_existing_owner_container_query_result.stdout_lines[0] is match('^[a-f0-9]{64}$')

- name: Inspect the current Gluetun owner container
  when: gluetun_existing_owner_container_id_candidate | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container inspect
      --format='{% raw %}{{json .}}{% endraw %}'
      {{ gluetun_existing_owner_container_id_candidate }}
  register: gluetun_existing_owner_container_inspect_result
  changed_when: false
  failed_when: false
  no_log: true

- name: Validate the current Gluetun owner inspection structure
  when:
    - gluetun_existing_owner_container_id_candidate | length > 0
    - gluetun_existing_owner_container_inspect_result.rc | default(1) == 0
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import sys

        document = json.load(sys.stdin)
        assert isinstance(document, dict)

        def require(path, expected_types):
            value = document
            for key in path:
                assert isinstance(value, dict)
                assert key in value
                value = value[key]
            assert isinstance(value, expected_types)
            return value

        require(("Id",), str)
        require(("Name",), str)
        require(("Image",), str)
        require(("State", "Running"), bool)
        require(("NetworkSettings", "SandboxID"), str)
        networks = require(("NetworkSettings", "Networks"), dict)
        assert all(isinstance(key, str) for key in networks)
        labels = require(("Config", "Labels"), (dict, type(None)))
        require(("Config", "Image"), str)
        entrypoint = require(("Config", "Entrypoint"), (list, type(None)))
        command = require(("Config", "Cmd"), (list, type(None)))
        health_test = require(("Config", "Healthcheck", "Test"), list)
        require(("Config", "Healthcheck", "Interval"), int)
        require(("Config", "Healthcheck", "Timeout"), int)
        require(("Config", "Healthcheck", "StartPeriod"), int)
        require(("Config", "Healthcheck", "Retries"), int)
        require(("Config", "Hostname"), str)
        require(("Config", "User"), str)
        environment = require(("Config", "Env"), (list, type(None)))
        require(("HostConfig", "NetworkMode"), str)
        require(("HostConfig", "Privileged"), bool)
        require(("HostConfig", "AutoRemove"), bool)
        require(("HostConfig", "RestartPolicy", "Name"), str)
        require(("HostConfig", "LogConfig", "Type"), str)
        require(("HostConfig", "PublishAllPorts"), bool)
        dns = require(("HostConfig", "Dns"), (list, type(None)))
        cap_drop = require(("HostConfig", "CapDrop"), (list, type(None)))
        cap_add = require(("HostConfig", "CapAdd"), (list, type(None)))
        devices = require(("HostConfig", "Devices"), (list, type(None)))
        sysctls = require(("HostConfig", "Sysctls"), (dict, type(None)))
        require(("HostConfig", "PortBindings"), (dict, type(None)))
        mounts = require(("Mounts",), list)

        if labels is not None:
            assert all(
                isinstance(key, str) and isinstance(value, str)
                for key, value in labels.items()
            )
        for values in (
            entrypoint,
            command,
            environment,
            dns,
            cap_drop,
            cap_add,
        ):
            if values is not None:
                assert all(isinstance(value, str) for value in values)
        assert all(isinstance(value, str) for value in health_test)
        if sysctls is not None:
            assert all(
                isinstance(key, str) and isinstance(value, str)
                for key, value in sysctls.items()
            )

        if devices is not None:
            for device in devices:
                assert isinstance(device, dict)
                assert isinstance(device.get("PathOnHost"), str)
                assert isinstance(device.get("PathInContainer"), str)
                assert isinstance(device.get("CgroupPermissions"), str)

        for mount in mounts:
            assert isinstance(mount, dict)
            assert isinstance(mount.get("Type"), str)
            assert isinstance(mount.get("Source"), str)
            assert isinstance(mount.get("Destination"), str)
            assert isinstance(mount.get("RW"), bool)
    stdin: "{{ gluetun_existing_owner_container_inspect_result.stdout }}"
  register: gluetun_existing_owner_inspect_shape_result
  changed_when: false
  failed_when: false
  no_log: true

- name: Parse the current Gluetun owner inspection
  when:
    - gluetun_existing_owner_container_id_candidate | length > 0
    - gluetun_existing_owner_container_inspect_result.rc | default(1) == 0
    - gluetun_existing_owner_inspect_shape_result.rc | default(1) == 0
  ansible.builtin.set_fact:
    gluetun_existing_owner_container_inspect: >-
      {{
        gluetun_existing_owner_container_inspect_result.stdout
        | from_json
      }}
  no_log: true

- name: Evaluate the complete current Gluetun owner contract
  when: gluetun_existing_owner_container_inspect | length > 0
  vars:
    gluetun_owner_contract_role_path: "{{ role_path }}"
  ansible.builtin.include_tasks: >-
    {{ role_path }}/tasks/evaluate_owner_contract.yml

- name: Evaluate current Gluetun owner role ownership
  when: gluetun_existing_owner_container_inspect | length > 0
  vars:
    gluetun_existing_owner_config: "{{ gluetun_existing_owner_container_inspect.Config | default({}) }}"
    gluetun_existing_owner_labels: "{{ gluetun_existing_owner_config.Labels | default({}, true) }}"
  ansible.builtin.set_fact:
    gluetun_existing_owner_container_owned: >-
      {{
        gluetun_existing_owner_container_inspect.Id
        == gluetun_existing_owner_container_id_candidate
        and gluetun_existing_owner_container_inspect.Name
        == '/' + gluetun_identifier
        and gluetun_existing_owner_labels.get(gluetun_container_owner_label, '')
        == gluetun_container_owner_label_value
      }}

- name: Record a foreign or ambiguous current Gluetun owner inspection
  ansible.builtin.set_fact:
    gluetun_pre_mutation_ambiguity_messages_list: >-
      {{
        gluetun_pre_mutation_ambiguity_messages_list
        + [
          'The exact-ID Gluetun owner is not positively identified by its '
          + 'role-owned identity label.'
        ]
      }}
  when:
    - gluetun_existing_owner_container_id_candidate | length > 0
    - not gluetun_existing_owner_container_owned | bool

- name: Mark an owned non-conforming Gluetun owner for exact-ID replacement
  ansible.builtin.set_fact:
    gluetun_existing_owner_requires_replacement: true
  when:
    - gluetun_existing_owner_container_id_candidate | length > 0
    - gluetun_existing_owner_container_owned | bool
    - not gluetun_existing_owner_container_contract_valid | bool

- name: Record the positively owned current Gluetun owner
  ansible.builtin.set_fact:
    gluetun_existing_owner_container_id: "{{ gluetun_existing_owner_container_inspect.Id }}"
    gluetun_existing_owner_is_running: "{{ gluetun_existing_owner_container_inspect.State.Running | bool }}"
    gluetun_existing_owner_sandbox_id: "{{ gluetun_existing_owner_container_inspect.NetworkSettings.SandboxID | default('') }}"
  when:
    - gluetun_existing_owner_container_id_candidate | length > 0
    - gluetun_existing_owner_container_owned | bool

- name: Query configured protected Gluetun consumers
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --all --no-trunc --quiet
      --filter 'name=^/{{ item.container_name | regex_escape }}$'
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_protected_consumer_query_results
  changed_when: false
  failed_when: false

- name: Conservatively isolate ambiguous protected-consumer queries
  ansible.builtin.set_fact:
    gluetun_protected_consumers_requiring_isolation_list: >-
      {{
        gluetun_protected_consumers_requiring_isolation_list
        + [item.item]
      }}
    gluetun_pre_mutation_ambiguity_messages_list: >-
      {{
        gluetun_pre_mutation_ambiguity_messages_list
        + [
          'The exact-name query for protected consumer `'
          + item.item.container_name
          + '` was ambiguous.'
        ]
      }}
  when: >-
    item.rc != 0
    or
    (
      item.stdout | trim | length > 0
      and
      (
        item.stdout_lines | length != 1
        or item.stdout_lines[0] is not match('^[a-f0-9]{64}$')
      )
    )
  loop: "{{ gluetun_protected_consumer_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Record existing protected Gluetun consumers
  ansible.builtin.set_fact:
    gluetun_existing_protected_consumers_list: >-
      {{
        gluetun_existing_protected_consumers_list
        + [
          {
            'container_id': item.stdout_lines[0],
            'definition': item.item
          }
        ]
      }}
    gluetun_protected_consumer_resolved_ids_by_name: >-
      {{
        gluetun_protected_consumer_resolved_ids_by_name
        | combine({item.item.container_name: item.stdout_lines[0]})
      }}
  when:
    - item.rc == 0
    - item.stdout_lines | length == 1
    - item.stdout_lines[0] is match('^[a-f0-9]{64}$')
  loop: "{{ gluetun_protected_consumer_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Inspect existing protected Gluetun consumers
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container inspect
      --format={% raw %}{{.Id}}|{{.Name}}|{{.State.Running}}|{{.HostConfig.NetworkMode}}|{{.NetworkSettings.SandboxID}}{% endraw %}
      {{ item.container_id }}
  loop: "{{ gluetun_existing_protected_consumers_list }}"
  loop_control:
    label: "{{ item.definition.container_name }}"
  register: gluetun_protected_consumer_inspect_results
  changed_when: false
  failed_when: false

- name: Record positively inspected configured consumer IDs
  vars:
    gluetun_protected_consumer_inspect_fields: >-
      {{ item.stdout.split('|') if item.rc == 0 else [] }}
    gluetun_protected_consumer_inspection_is_valid: >-
      {{
        item.rc == 0
        and gluetun_protected_consumer_inspect_fields | length == 5
        and gluetun_protected_consumer_inspect_fields[0] == item.item.container_id
        and gluetun_protected_consumer_inspect_fields[1] == '/' + item.item.definition.container_name
        and gluetun_protected_consumer_inspect_fields[2] in ['true', 'false']
        and (
          gluetun_protected_consumer_inspect_fields[4] == ''
          or gluetun_protected_consumer_inspect_fields[4] is match('^[a-f0-9]{64}$')
        )
      }}
  ansible.builtin.set_fact:
    gluetun_configured_consumer_container_ids_list: >-
      {{
        gluetun_configured_consumer_container_ids_list
        + [item.item.container_id]
      }}
  when: gluetun_protected_consumer_inspection_is_valid | bool
  loop: "{{ gluetun_protected_consumer_inspect_results.results }}"
  loop_control:
    label: "{{ item.item.definition.container_name }}"

- name: Conservatively isolate ambiguous protected-consumer inspections
  vars:
    gluetun_protected_consumer_inspect_fields: >-
      {{ item.stdout.split('|') if item.rc == 0 else [] }}
    gluetun_protected_consumer_inspection_is_valid: >-
      {{
        item.rc == 0
        and gluetun_protected_consumer_inspect_fields | length == 5
        and gluetun_protected_consumer_inspect_fields[0] == item.item.container_id
        and gluetun_protected_consumer_inspect_fields[1] == '/' + item.item.definition.container_name
        and gluetun_protected_consumer_inspect_fields[2] in ['true', 'false']
        and (
          gluetun_protected_consumer_inspect_fields[4] == ''
          or gluetun_protected_consumer_inspect_fields[4] is match('^[a-f0-9]{64}$')
        )
      }}
  ansible.builtin.set_fact:
    gluetun_protected_consumers_requiring_isolation_list: >-
      {{
        gluetun_protected_consumers_requiring_isolation_list
        + [item.item.definition]
      }}
    gluetun_pre_mutation_ambiguity_messages_list: >-
      {{
        gluetun_pre_mutation_ambiguity_messages_list
        + [
          'The exact-ID inspection for protected consumer `'
          + item.item.definition.container_name
          + '` was ambiguous.'
        ]
      }}
  when: not gluetun_protected_consumer_inspection_is_valid | bool
  loop: "{{ gluetun_protected_consumer_inspect_results.results }}"
  loop_control:
    label: "{{ item.item.definition.container_name }}"

- name: Identify running protected consumers not using the exact current owner ID
  vars:
    gluetun_protected_consumer_inspect_fields: "{{ item.stdout.split('|') }}"
  ansible.builtin.set_fact:
    gluetun_protected_consumers_requiring_isolation_list: >-
      {{
        gluetun_protected_consumers_requiring_isolation_list
        + [item.item.definition]
      }}
  when:
    - item.rc == 0
    - gluetun_protected_consumer_inspect_fields | length == 5
    - gluetun_protected_consumer_inspect_fields[0] == item.item.container_id
    - gluetun_protected_consumer_inspect_fields[1] == '/' + item.item.definition.container_name
    - gluetun_protected_consumer_inspect_fields[2] == 'true'
    - >-
      gluetun_protected_consumer_inspect_fields[4] == ''
      or
      gluetun_protected_consumer_inspect_fields[4] is match('^[a-f0-9]{64}$')
    - >-
      gluetun_existing_owner_container_id | length == 0
      or
      not (gluetun_existing_owner_is_running | bool)
      or
      not (gluetun_existing_owner_container_contract_valid | bool)
      or
      gluetun_protected_consumer_inspect_fields[3]
      != 'container:' + gluetun_existing_owner_container_id
  loop: "{{ gluetun_protected_consumer_inspect_results.results }}"
  loop_control:
    label: "{{ item.item.definition.container_name }}"

- name: Check configured protected-consumer unit contracts before isolation
  ansible.builtin.stat:
    path: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + item.systemd_service_name
      }}
    follow: false
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_protected_consumer_unit_stats

- name: Require configured protected-consumer units before isolation
  ansible.builtin.assert:
    that:
      - item.stat.exists | bool
      - item.stat.isreg | default(false) | bool
      - not item.stat.islnk | default(false) | bool
    fail_msg: >-
      Protected-consumer unit `{{ item.item.systemd_service_name }}` must be a
      real role-owned unit before Gluetun may stop it or add reverse startup
      coupling.
  loop: "{{ gluetun_protected_consumer_unit_stats.results }}"
  loop_control:
    label: "{{ item.item.systemd_service_name }}"

- name: Read configured protected-consumer unit contracts before isolation
  ansible.builtin.slurp:
    src: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + item.systemd_service_name
      }}
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_protected_consumer_unit_contents

- name: Verify configured protected-consumer unit contracts before isolation
  vars:
    gluetun_protected_consumer_unit_lines: >-
      {{ (item.content | b64decode).splitlines() }}
  ansible.builtin.assert:
    that:
      - >-
        item.item.systemd_unit_role_marker
        in gluetun_protected_consumer_unit_lines
      - "'BindsTo=' + gluetun_identifier + '.service' in gluetun_protected_consumer_unit_lines"
      - "'After=' + gluetun_identifier + '.service' in gluetun_protected_consumer_unit_lines"
      - >-
        '# MASH-NetworkNamespaceOwner=' + gluetun_identifier
        in gluetun_protected_consumer_unit_lines
      - >-
        '# MASH-NetworkNamespaceIdentity=resolved-full-container-id'
        in gluetun_protected_consumer_unit_lines
    fail_msg: >-
      Protected-consumer unit `{{ item.item.systemd_service_name }}` is not the
      expected role-owned, owner-coupled, exact-ID namespace consumer. It has
      not been used as a stop target.
  loop: "{{ gluetun_protected_consumer_unit_contents.results }}"
  loop_control:
    label: "{{ item.item.systemd_service_name }}"

- name: Attempt to stop systemd units for protected consumers requiring isolation
  ansible.builtin.service:
    name: "{{ item.systemd_service_name }}"
    state: stopped
  loop: "{{ gluetun_protected_consumers_requiring_isolation_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_unsafe_protected_consumer_unit_stop_results
  failed_when: false

- name: Stop positively resolved protected-consumer IDs requiring isolation
  when: item.container_name in gluetun_protected_consumer_resolved_ids_by_name
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - stop
      - --time
      - "{{ gluetun_container_stop_grace_time_seconds | string }}"
      - "{{ gluetun_protected_consumer_resolved_ids_by_name[item.container_name] }}"
  loop: "{{ gluetun_protected_consumers_requiring_isolation_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_unsafe_resolved_protected_consumer_stop_results
  changed_when: gluetun_unsafe_resolved_protected_consumer_stop_results.rc == 0
  failed_when: false

- name: Prove isolated protected-consumer systemd units are inactive or absent
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - is-active
      - "{{ item.systemd_service_name }}"
  loop: "{{ gluetun_protected_consumers_requiring_isolation_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_isolated_protected_consumer_unit_query_results
  changed_when: false
  failed_when: false

- name: Prove isolated protected consumer containers are stopped or absent
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
      --filter 'name=^/{{ item.container_name | regex_escape }}$'
  loop: "{{ gluetun_protected_consumers_requiring_isolation_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_isolated_protected_consumer_query_results
  changed_when: false
  failed_when: false

- name: Prove originally resolved protected-consumer IDs are no longer running
  when: item.container_name in gluetun_protected_consumer_resolved_ids_by_name
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
      --filter id={{ gluetun_protected_consumer_resolved_ids_by_name[item.container_name] }}
  loop: "{{ gluetun_protected_consumers_requiring_isolation_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_isolated_resolved_protected_consumer_query_results
  changed_when: false
  failed_when: false

- name: Fail unless protected-consumer unit isolation converged
  ansible.builtin.assert:
    that:
      - item.rc in [3, 4]
      - item.stdout | trim in ['inactive', 'failed', 'unknown']
    fail_msg: >-
      Protected-consumer unit `{{ item.item.systemd_service_name }}` is not
      proven inactive; refusing to mutate or install the Gluetun owner.
  loop: "{{ gluetun_isolated_protected_consumer_unit_query_results.results }}"
  loop_control:
    label: "{{ item.item.systemd_service_name }}"

- name: Fail unless protected-consumer container isolation converged
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length == 0
    fail_msg: >-
      Protected consumer `{{ item.item.container_name }}` is still running;
      refusing to mutate or install the Gluetun owner.
  loop: "{{ gluetun_isolated_protected_consumer_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Fail unless originally resolved consumer IDs are isolated
  when: not item.skipped | default(false)
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length == 0
    fail_msg: >-
      The originally resolved ID for protected consumer
      `{{ item.item.container_name }}` is still running.
  loop: "{{ gluetun_isolated_resolved_protected_consumer_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Fail closed after isolating any ambiguous configured consumer
  ansible.builtin.assert:
    that:
      - gluetun_pre_mutation_ambiguity_messages_list | length == 0
    fail_msg: >-
      {{
        gluetun_pre_mutation_ambiguity_messages_list
        | join(' ')
      }}

- name: Query all running containers for namespace-registry validation
  when: gluetun_existing_owner_container_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
  register: gluetun_running_container_query_result
  changed_when: false

- name: Validate running container IDs for namespace-registry validation
  when: gluetun_existing_owner_container_id | length > 0
  ansible.builtin.assert:
    that:
      - item is match('^[a-f0-9]{64}$')
    fail_msg: A running-container query returned a malformed container ID.
  loop: "{{ gluetun_running_container_query_result.stdout_lines | default([]) }}"

- name: Inspect running containers for shared Gluetun namespace use
  when: gluetun_existing_owner_container_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container inspect
      --format={% raw %}{{.Id}}|{{.State.Running}}|{{.HostConfig.NetworkMode}}|{{.NetworkSettings.SandboxID}}|{{.Name}}{% endraw %}
      {{ item }}
  loop: "{{ gluetun_running_container_query_result.stdout_lines | default([]) }}"
  register: gluetun_running_container_inspect_results
  changed_when: false

- name: Validate running-container namespace inspections
  vars:
    gluetun_running_container_inspect_fields: "{{ item.stdout.split('|') }}"
  ansible.builtin.assert:
    that:
      - gluetun_running_container_inspect_fields | length == 5
      - gluetun_running_container_inspect_fields[0] == item.item
      - gluetun_running_container_inspect_fields[1] == 'true'
      - >-
        gluetun_running_container_inspect_fields[3] == ''
        or
        gluetun_running_container_inspect_fields[3] is match('^[a-f0-9]{64}$')
      - gluetun_running_container_inspect_fields[4] is match('^/[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
    fail_msg: A running-container namespace inspection was malformed.
  loop: "{{ gluetun_running_container_inspect_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Record running containers sharing the Gluetun network namespace
  vars:
    gluetun_running_container_inspect_fields: "{{ item.stdout.split('|') }}"
    gluetun_running_container_namespace_reference: >-
      {{
        gluetun_running_container_inspect_fields[2]
        | regex_replace('^container:', '')
      }}
  ansible.builtin.set_fact:
    gluetun_running_namespace_consumers_list: >-
      {{
        gluetun_running_namespace_consumers_list
        + [
          {
            'container_id': gluetun_running_container_inspect_fields[0],
            'container_name': gluetun_running_container_inspect_fields[4]
          }
        ]
      }}
  when:
    - gluetun_existing_owner_container_id | length > 0
    - gluetun_running_container_inspect_fields[0] != gluetun_existing_owner_container_id
    - >-
      (
        gluetun_running_container_inspect_fields[2]
        == 'container:' + gluetun_existing_owner_container_id
      )
      or
      (
        gluetun_running_container_inspect_fields[2]
        == 'container:' + gluetun_identifier
      )
      or
      (
        gluetun_running_container_inspect_fields[2].startswith('container:')
        and gluetun_running_container_namespace_reference | length >= 12
        and gluetun_existing_owner_container_id.startswith(gluetun_running_container_namespace_reference)
      )
      or
      (
        gluetun_existing_owner_sandbox_id | length > 0
        and gluetun_running_container_inspect_fields[3]
        == gluetun_existing_owner_sandbox_id
      )
  loop: "{{ gluetun_running_container_inspect_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Enforce the one-owner one-consumer namespace registry
  ansible.builtin.assert:
    that:
      - gluetun_running_namespace_consumers_list | length <= 1
      - >-
        gluetun_running_namespace_consumers_list
        | map(attribute='container_id')
        | difference(gluetun_configured_consumer_container_ids_list)
        | length == 0
    fail_msg: >-
      An unknown or additional running container shares the current Gluetun
      network namespace; refusing to mutate the owner.

- name: Quiesce Gluetun for replacement or persistent recovery
  when: >-
    gluetun_existing_owner_requires_replacement | bool
    or gluetun_existing_quiesce_dropin_owned | default(false) | bool
  vars:
    gluetun_quiesce_owner_id: "{{ gluetun_existing_owner_container_id }}"
    gluetun_quiesce_owner_authorized: "{{ gluetun_existing_owner_container_owned }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/quiesce.yml"

- name: Stop the captured non-conforming Gluetun owner ID without a unit
  when:
    - gluetun_existing_owner_requires_replacement | bool
    - not gluetun_existing_unit_stat.stat.exists | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - stop
      - --time
      - "{{ gluetun_container_stop_grace_time_seconds | string }}"
      - "{{ gluetun_existing_owner_container_id_candidate }}"
  register: gluetun_nonconforming_owner_stop_result
  changed_when: gluetun_nonconforming_owner_stop_result.rc == 0
  failed_when: false

- name: Remove only the captured non-conforming Gluetun owner ID
  when: gluetun_existing_owner_requires_replacement | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - rm
      - --force
      - "{{ gluetun_existing_owner_container_id_candidate }}"
  register: gluetun_nonconforming_owner_remove_result
  changed_when: gluetun_nonconforming_owner_remove_result.rc == 0
  failed_when: false

- name: Prove the replaced Gluetun owner ID is absent
  when: gluetun_existing_owner_requires_replacement | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --quiet
      - --filter
      - "id={{ gluetun_existing_owner_container_id_candidate }}"
  register: gluetun_replaced_owner_id_query_result
  changed_when: false
  failed_when: false

- name: Prove the Gluetun owner name remains absent after replacement cleanup
  when: gluetun_existing_owner_requires_replacement | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --quiet
      - --filter
      - "name=^/{{ gluetun_identifier | replace('.', '[.]') }}$"
  register: gluetun_replaced_owner_name_query_result
  changed_when: false
  failed_when: false

- name: Require exact-ID Gluetun owner replacement cleanup to converge
  when: gluetun_existing_owner_requires_replacement | bool
  ansible.builtin.assert:
    that:
      - gluetun_replaced_owner_id_query_result.rc == 0
      - gluetun_replaced_owner_id_query_result.stdout | trim | length == 0
      - gluetun_replaced_owner_name_query_result.rc == 0
      - gluetun_replaced_owner_name_query_result.stdout | trim | length == 0
      - >-
        not gluetun_existing_unit_stat.stat.exists | bool
        or gluetun_quiesce_applied | default(false) | bool
    fail_msg: >-
      The captured non-conforming Gluetun owner was not proven absent. A later
      same-name replacement was retained and never became a cleanup target.

- name: Revalidate Gluetun application-data paths immediately before mutation
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_paths.yml"

- name: Ensure Gluetun paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ gluetun_uid }}"
    group: "{{ gluetun_gid }}"
  loop:
    - path: "{{ gluetun_base_path }}"
      mode: "0750"
    - path: "{{ gluetun_data_path }}"
      mode: "0750"
    - path: "{{ gluetun_secrets_path }}"
      mode: "0700"

- name: Ensure Gluetun non-secret support files are installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: "{{ gluetun_uid }}"
    group: "{{ gluetun_gid }}"
  loop:
    - src: env.j2
      dest: "{{ gluetun_environment_file_path }}"
      mode: "0640"
    - src: companion-resolv.conf.j2
      dest: "{{ gluetun_companion_resolv_conf_path }}"
      mode: "0644"
  register: gluetun_support_files_result

- name: Ensure Gluetun control-server authentication file is installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/control-server-auth.toml.j2"
    dest: "{{ gluetun_control_server_auth_config_path }}"
    mode: "0600"
    owner: "{{ gluetun_uid }}"
    group: "{{ gluetun_gid }}"
  register: gluetun_control_server_auth_config_result
  no_log: true
  diff: false

- name: Ensure the immutable-ID Gluetun container helper is installed
  vars:
    gluetun_template_role_path: "{{ role_path }}"
  ansible.builtin.template:
    src: "{{ role_path }}/templates/gluetun-container-helper.j2"
    dest: "{{ gluetun_container_helper_path }}"
    mode: "0755"
    owner: root
    group: root
  register: gluetun_container_helper_result

- name: Ensure obsolete Gluetun managed secret files are absent
  ansible.builtin.file:
    path: "{{ gluetun_secrets_path }}/{{ item }}"
    state: absent
  loop: >-
    {{
      gluetun_secret_file_names_known
      | difference(gluetun_secret_files | map(attribute='name') | list)
    }}
  register: gluetun_obsolete_secret_files_result
  no_log: true
  diff: false

- name: Ensure Gluetun managed secret files are installed
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ gluetun_secrets_path }}/{{ item.name }}"
    mode: "0600"
    owner: "{{ gluetun_uid }}"
    group: "{{ gluetun_gid }}"
  loop: "{{ gluetun_secret_files }}"
  loop_control:
    label: "{{ item.name }}"
  register: gluetun_secret_files_result
  no_log: true
  diff: false

- name: Ensure Gluetun container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ gluetun_container_image }}"
    pull: always
  register: gluetun_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: gluetun_container_image_pull_result_ansible_module is not failed

- name: Ensure Gluetun container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ gluetun_container_image }}"
  register: gluetun_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: gluetun_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in gluetun_container_image_pull_result_command.stdout"

- name: Initialize Gluetun network identity
  ansible.builtin.set_fact:
    gluetun_existing_network_id: ""

- name: Query the exact Gluetun container network name
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      network ls --no-trunc --quiet
      --filter 'name=^{{ gluetun_container_network | regex_escape }}$'
  register: gluetun_existing_network_query_result
  changed_when: false

- name: Validate the exact Gluetun container network query
  ansible.builtin.assert:
    that:
      - >-
        gluetun_existing_network_query_result.stdout | trim | length == 0
        or
        (
          gluetun_existing_network_query_result.stdout_lines | length == 1
          and
          gluetun_existing_network_query_result.stdout_lines[0]
          is match('^[a-f0-9]{64}$')
        )
    fail_msg: The exact Gluetun network query returned an ambiguous identity.

- name: Record the existing Gluetun container network ID
  ansible.builtin.set_fact:
    gluetun_existing_network_id: "{{ gluetun_existing_network_query_result.stdout_lines[0] }}"
  when: gluetun_existing_network_query_result.stdout_lines | length == 1

- name: Inspect existing Gluetun container network metadata by exact ID
  when: gluetun_existing_network_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      network inspect
      --format='{% raw %}{{.Id}}|{{.Name}}|{{.Driver}}|{{.EnableIPv6}}|{{index .Labels "io.mash.gluetun.owner"}}{% endraw %}'
      {{ gluetun_existing_network_id }}
  register: gluetun_existing_network_metadata_result
  changed_when: false

- name: Inspect existing Gluetun container network endpoints by exact ID
  when: gluetun_existing_network_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      network inspect
      --format='{% raw %}{{range .Containers}}{{println .Name}}{{end}}{% endraw %}'
      {{ gluetun_existing_network_id }}
  register: gluetun_existing_network_endpoints_result
  changed_when: false

- name: Validate an existing owned Gluetun container network before reuse
  when: gluetun_existing_network_id | length > 0
  vars:
    gluetun_existing_network_metadata_fields: "{{ gluetun_existing_network_metadata_result.stdout.split('|') }}"
  ansible.builtin.assert:
    that:
      - gluetun_existing_network_metadata_fields | length == 5
      - gluetun_existing_network_metadata_fields[0] == gluetun_existing_network_id
      - gluetun_existing_network_metadata_fields[1] == gluetun_container_network
      - gluetun_existing_network_metadata_fields[2] == 'bridge'
      - gluetun_existing_network_metadata_fields[3] == 'false'
      - >-
        gluetun_existing_network_metadata_fields[4]
        == gluetun_container_network_owner_label_value
      - >-
        gluetun_existing_network_endpoints_result.stdout_lines
        | difference(([gluetun_identifier] + gluetun_container_network_known_peer_containers_list) | unique)
        | length == 0
    fail_msg: >-
      Refusing to adopt an existing network without the exact Gluetun owner
      label, IPv4-only bridge settings, and endpoint allowlist.

- name: Ensure Gluetun container network is created via community.docker.docker_network
  when:
    - gluetun_existing_network_id | length == 0
    - devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: false
    name: "{{ gluetun_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
    labels:
      io.mash.gluetun.owner: "{{ gluetun_container_network_owner_label_value }}"
  register: gluetun_network_creation_result_ansible_module

- name: Ensure Gluetun container network is created via ansible.builtin.command
  when:
    - gluetun_existing_network_id | length == 0
    - devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      --driver=bridge
      --label={{ gluetun_container_network_owner_label }}={{ gluetun_container_network_owner_label_value }}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ gluetun_container_network }}
  register: gluetun_network_creation_result_command
  changed_when: gluetun_network_creation_result_command.rc == 0

- name: Query the installed Gluetun container network identity
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      network ls --no-trunc --quiet
      --filter 'name=^{{ gluetun_container_network | regex_escape }}$'
  register: gluetun_installed_network_query_result
  changed_when: false

- name: Require one exact installed Gluetun container network identity
  ansible.builtin.assert:
    that:
      - gluetun_installed_network_query_result.stdout_lines | length == 1
      - gluetun_installed_network_query_result.stdout_lines[0] is match('^[a-f0-9]{64}$')
    fail_msg: The installed Gluetun network does not have one exact identity.

- name: Record the installed Gluetun container network identity
  ansible.builtin.set_fact:
    gluetun_installed_network_id: "{{ gluetun_installed_network_query_result.stdout_lines[0] }}"

- name: Inspect installed Gluetun container network metadata by exact ID
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      network inspect
      --format='{% raw %}{{.Id}}|{{.Name}}|{{.Driver}}|{{.EnableIPv6}}|{{index .Labels "io.mash.gluetun.owner"}}{% endraw %}'
      {{ gluetun_installed_network_id }}
  register: gluetun_installed_network_metadata_result
  changed_when: false

- name: Inspect installed Gluetun container network endpoints by exact ID
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      network inspect
      --format='{% raw %}{{range .Containers}}{{println .Name}}{{end}}{% endraw %}'
      {{ gluetun_installed_network_id }}
  register: gluetun_installed_network_endpoints_result
  changed_when: false

- name: Validate the installed owned Gluetun container network
  vars:
    gluetun_installed_network_metadata_fields: "{{ gluetun_installed_network_metadata_result.stdout.split('|') }}"
  ansible.builtin.assert:
    that:
      - gluetun_installed_network_metadata_fields | length == 5
      - gluetun_installed_network_metadata_fields[0] == gluetun_installed_network_id
      - gluetun_installed_network_metadata_fields[1] == gluetun_container_network
      - gluetun_installed_network_metadata_fields[2] == 'bridge'
      - gluetun_installed_network_metadata_fields[3] == 'false'
      - >-
        gluetun_installed_network_metadata_fields[4]
        == gluetun_container_network_owner_label_value
      - >-
        gluetun_installed_network_endpoints_result.stdout_lines
        | difference(([gluetun_identifier] + gluetun_container_network_known_peer_containers_list) | unique)
        | length == 0
    fail_msg: >-
      The installed network does not satisfy the owned, dedicated IPv4-only
      Gluetun bridge and endpoint contract.

- name: Ensure Gluetun systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/gluetun.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service"
    mode: "0644"
  register: gluetun_systemd_service_result

- name: Reload systemd with the final Gluetun owner unit
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - daemon-reload
  changed_when: gluetun_systemd_service_result.changed | bool

- name: Release Gluetun owner quiescing after final unit installation
  vars:
    gluetun_quiesce_release_final_unit_expected: true
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/release_quiesce.yml"

- name: Determine whether Gluetun needs a restart
  ansible.builtin.set_fact:
    gluetun_restart_necessary: >-
      {{
        gluetun_support_files_result.changed | default(false)
        or gluetun_control_server_auth_config_result.changed | default(false)
        or gluetun_container_helper_result.changed | default(false)
        or gluetun_obsolete_secret_files_result.changed | default(false)
        or gluetun_secret_files_result.changed | default(false)
        or gluetun_systemd_service_result.changed | default(false)
        or gluetun_container_image_pull_result_ansible_module.changed | default(false)
        or gluetun_container_image_pull_result_command.changed | default(false)
        or gluetun_network_creation_result_ansible_module.changed | default(false)
        or gluetun_network_creation_result_command.changed | default(false)
        or gluetun_existing_owner_requires_replacement | bool
        or gluetun_quiesce_applied | default(false) | bool
      }}
