---
- name: Validate Gluetun cleanup collections
  ansible.builtin.assert:
    that:
      - gluetun_protected_consumers_list | type_debug == 'list'
      - gluetun_protected_consumers_list | length <= 1
      - gluetun_systemd_dependent_services_list | type_debug == 'list'
      - gluetun_systemd_dependent_services_list | length <= 1
      - gluetun_container_network_known_peer_containers_list | type_debug == 'list'
      - >-
        gluetun_systemd_dependent_services_list | unique | length
        == gluetun_systemd_dependent_services_list | length
      - >-
        gluetun_container_network_known_peer_containers_list | unique | length
        == gluetun_container_network_known_peer_containers_list | length
      - gluetun_identifier is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - gluetun_identifier is not match('^[a-f0-9]+$')
      - gluetun_container_network is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - gluetun_container_network is not match('^[a-f0-9]+$')
      - gluetun_container_owner_label == 'io.mash.gluetun.owner'
      - gluetun_container_owner_label_value == gluetun_identifier
      - gluetun_container_fail_closed_contract_label == 'io.mash.gluetun.fail-closed-contract'
      - gluetun_container_fail_closed_contract_label_value == 'v1'
      - gluetun_container_network_owner_label == 'io.mash.gluetun.owner'
      - gluetun_container_network_owner_label_value == gluetun_identifier
      - gluetun_container_stop_grace_time_seconds | string is match('^[0-9]+$')
      - gluetun_container_stop_grace_time_seconds | int > 0
      - gluetun_base_path is match('^/[a-zA-Z0-9_./-]+$')
      - "'..' not in gluetun_base_path.split('/')"
      - not gluetun_base_path.endswith('/')
      - gluetun_data_path == gluetun_base_path + '/data'
      - gluetun_secrets_path == gluetun_base_path + '/secrets'
      - gluetun_environment_file_path == gluetun_base_path + '/env'
      - gluetun_companion_resolv_conf_path == gluetun_base_path + '/companion-resolv.conf'
      - gluetun_control_server_auth_config_path == gluetun_secrets_path + '/control-server-auth.toml'
      - gluetun_control_server_auth_config_container_path == '/run/secrets/control-server-auth.toml'
      - >-
        gluetun_container_helper_path
        ==
        devture_systemd_docker_base_systemd_path
        + '/'
        + gluetun_identifier
        + '-container-helper'
      - >-
        gluetun_systemd_dependent_services_list
        ==
        gluetun_protected_consumers_list
        | map(attribute='systemd_service_name')
        | list
    fail_msg: Gluetun cleanup settings have an invalid type, value, or format.

- name: Validate protected-consumer identities for cleanup
  ansible.builtin.assert:
    that:
      - item | type_debug == 'dict'
      - >-
        item.keys() | sort
        ==
        [
          'container_name',
          'systemd_service_name',
          'systemd_unit_role_marker'
        ]
      - item.container_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item.container_name is not match('^[a-f0-9]+$')
      - item.container_name != gluetun_identifier
      - item.systemd_service_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$')
      - item.systemd_service_name != gluetun_identifier + '.service'
      - >-
        item.systemd_unit_role_marker
        is match('^# MASH-Role=[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
    fail_msg: A Gluetun protected-consumer identity is unsafe for cleanup.
  loop: "{{ gluetun_protected_consumers_list }}"

- name: Validate protected-service systemd unit names for cleanup
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$')
      - item != gluetun_identifier + '.service'
    fail_msg: A Gluetun protected-service unit name is unsafe for cleanup.
  loop: "{{ gluetun_systemd_dependent_services_list }}"

- name: Validate known network peer names for cleanup
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item is not match('^[a-f0-9]+$')
      - item != gluetun_identifier
    fail_msg: A Gluetun known network peer name is unsafe for cleanup.
  loop: "{{ gluetun_container_network_known_peer_containers_list }}"

- name: Initialize Gluetun uninstall identity state
  ansible.builtin.set_fact:
    gluetun_uninstall_owner_container_id: ""
    gluetun_uninstall_owner_sandbox_id: ""
    gluetun_uninstall_running_namespace_consumers_list: []
    gluetun_uninstall_network_id: ""
    gluetun_uninstall_consumer_resolved_ids_by_name: {}
    gluetun_uninstall_consumer_ambiguity_messages_list: []
    gluetun_uninstall_owned_consumer_unit_stop_targets_list: []

- name: Inspect configured protected-consumer units before uninstall isolation
  ansible.builtin.stat:
    path: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + item.systemd_service_name
      }}
    follow: false
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_uninstall_consumer_unit_stats

- name: Require existing protected-consumer units to be safe objects
  when: item.stat.exists | bool
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false) | bool
      - not item.stat.islnk | default(false) | bool
    fail_msg: >-
      Protected-consumer unit `{{ item.item.systemd_service_name }}` is not a
      real role-owned file. It has not been used as a stop target.
  loop: "{{ gluetun_uninstall_consumer_unit_stats.results }}"
  loop_control:
    label: "{{ item.item.systemd_service_name }}"

- name: Read existing protected-consumer units before uninstall isolation
  when: item.stat.exists | bool
  ansible.builtin.slurp:
    src: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + item.item.systemd_service_name
      }}
  loop: "{{ gluetun_uninstall_consumer_unit_stats.results }}"
  loop_control:
    label: "{{ item.item.systemd_service_name }}"
  register: gluetun_uninstall_consumer_unit_contents

- name: Require existing protected-consumer units to be role-owned
  when: not item.skipped | default(false)
  vars:
    gluetun_uninstall_consumer_unit_lines: >-
      {{ (item.content | b64decode).splitlines() }}
  ansible.builtin.assert:
    that:
      - >-
        item.item.item.systemd_unit_role_marker
        in gluetun_uninstall_consumer_unit_lines
    fail_msg: >-
      Protected-consumer unit `{{ item.item.item.systemd_service_name }}` is
      not recognized as role-owned. It has not been used as a stop target.
  loop: "{{ gluetun_uninstall_consumer_unit_contents.results }}"
  loop_control:
    label: "{{ item.item.item.systemd_service_name }}"

- name: Record role-owned protected-consumer unit stop targets
  when: not item.skipped | default(false)
  ansible.builtin.set_fact:
    gluetun_uninstall_owned_consumer_unit_stop_targets_list: >-
      {{
        gluetun_uninstall_owned_consumer_unit_stop_targets_list
        + [item.item.item.systemd_service_name]
      }}
  loop: "{{ gluetun_uninstall_consumer_unit_contents.results }}"
  loop_control:
    label: "{{ item.item.item.systemd_service_name }}"

- name: Query configured protected-consumer identities before uninstall
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --all --no-trunc --quiet
      --filter 'name=^/{{ item.container_name | regex_escape }}$'
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_uninstall_consumer_identity_query_results
  changed_when: false
  failed_when: false

- name: Record ambiguous protected-consumer identities before uninstall
  ansible.builtin.set_fact:
    gluetun_uninstall_consumer_ambiguity_messages_list: >-
      {{
        gluetun_uninstall_consumer_ambiguity_messages_list
        + [
          'The exact-name query for protected consumer `'
          + item.item.container_name
          + '` was ambiguous.'
        ]
      }}
  when: >-
    item.rc != 0
    or
    (
      item.stdout | trim | length > 0
      and
      (
        item.stdout_lines | length != 1
        or item.stdout_lines[0] is not match('^[a-f0-9]{64}$')
      )
    )
  loop: "{{ gluetun_uninstall_consumer_identity_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Record resolved protected-consumer IDs before uninstall
  ansible.builtin.set_fact:
    gluetun_uninstall_consumer_resolved_ids_by_name: >-
      {{
        gluetun_uninstall_consumer_resolved_ids_by_name
        | combine({item.item.container_name: item.stdout_lines[0]})
      }}
  when:
    - item.rc == 0
    - item.stdout_lines | length == 1
    - item.stdout_lines[0] is match('^[a-f0-9]{64}$')
  loop: "{{ gluetun_uninstall_consumer_identity_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Attempt to stop configured protected-consumer systemd units
  when:
    item.systemd_service_name
    in gluetun_uninstall_owned_consumer_unit_stop_targets_list
  ansible.builtin.service:
    name: "{{ item.systemd_service_name }}"
    state: stopped
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_protected_consumer_uninstall_unit_stop_results
  failed_when: false

- name: Stop resolved protected-consumer IDs before removing Gluetun
  when: item.container_name in gluetun_uninstall_consumer_resolved_ids_by_name
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - stop
      - --time
      - "{{ gluetun_container_stop_grace_time_seconds | string }}"
      - "{{ gluetun_uninstall_consumer_resolved_ids_by_name[item.container_name] }}"
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_resolved_protected_consumer_uninstall_stop_results
  changed_when: gluetun_resolved_protected_consumer_uninstall_stop_results.rc == 0
  failed_when: false

- name: Prove configured protected-consumer systemd units are inactive or absent
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - is-active
      - "{{ item.systemd_service_name }}"
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.systemd_service_name }}"
  register: gluetun_protected_consumer_uninstall_unit_query_results
  changed_when: false
  failed_when: false

- name: Prove protected consumer containers are stopped or absent before removing Gluetun
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
      --filter 'name=^/{{ item.container_name | regex_escape }}$'
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_protected_consumer_uninstall_query_results
  changed_when: false
  failed_when: false

- name: Prove resolved protected-consumer IDs are stopped or absent before removing Gluetun
  when: item.container_name in gluetun_uninstall_consumer_resolved_ids_by_name
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
      --filter id={{ gluetun_uninstall_consumer_resolved_ids_by_name[item.container_name] }}
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_resolved_protected_consumer_uninstall_query_results
  changed_when: false
  failed_when: false

- name: Fail unless protected-consumer unit shutdown converged before removing Gluetun
  ansible.builtin.assert:
    that:
      - item.rc in [3, 4]
      - item.stdout | trim in ['inactive', 'failed', 'unknown']
    fail_msg: >-
      Protected-consumer unit `{{ item.item.systemd_service_name }}` is not
      proven inactive; refusing to remove the Gluetun owner.
  loop: "{{ gluetun_protected_consumer_uninstall_unit_query_results.results }}"
  loop_control:
    label: "{{ item.item.systemd_service_name }}"

- name: Fail unless protected-consumer container shutdown converged before removing Gluetun
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length == 0
    fail_msg: >-
      Protected consumer `{{ item.item.container_name }}` is still running;
      refusing to remove the Gluetun owner.
  loop: "{{ gluetun_protected_consumer_uninstall_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Fail unless resolved protected-consumer IDs stopped before removing Gluetun
  when: not item.skipped | default(false)
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length == 0
    fail_msg: >-
      The originally resolved ID for protected consumer
      `{{ item.item.container_name }}` is still running.
  loop: "{{ gluetun_resolved_protected_consumer_uninstall_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Fail closed after isolating ambiguous uninstall consumer identities
  ansible.builtin.assert:
    that:
      - gluetun_uninstall_consumer_ambiguity_messages_list | length == 0
    fail_msg: "{{ gluetun_uninstall_consumer_ambiguity_messages_list | join(' ') }}"

- name: Query the exact Gluetun owner container before removal
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --all --no-trunc --quiet
      --filter 'name=^/{{ gluetun_identifier | regex_escape }}$'
  register: gluetun_uninstall_owner_container_query_result
  changed_when: false

- name: Validate the exact Gluetun owner container query before removal
  ansible.builtin.assert:
    that:
      - >-
        gluetun_uninstall_owner_container_query_result.stdout | trim | length == 0
        or
        (
          gluetun_uninstall_owner_container_query_result.stdout_lines | length == 1
          and
          gluetun_uninstall_owner_container_query_result.stdout_lines[0]
          is match('^[a-f0-9]{64}$')
        )
    fail_msg: The exact Gluetun owner query was ambiguous; nothing was removed.

- name: Record the exact Gluetun owner container ID for removal
  ansible.builtin.set_fact:
    gluetun_uninstall_owner_container_id: >-
      {{ gluetun_uninstall_owner_container_query_result.stdout_lines[0] }}
  when: gluetun_uninstall_owner_container_query_result.stdout_lines | length == 1

- name: Inspect the exact Gluetun owner container before removal
  when: gluetun_uninstall_owner_container_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container inspect
      --format='{% raw %}{{.Id}}|{{.Name}}|{{.State.Running}}|{{.NetworkSettings.SandboxID}}|{{index .Config.Labels "io.mash.gluetun.owner"}}|{{index .Config.Labels "io.mash.gluetun.fail-closed-contract"}}{% endraw %}'
      {{ gluetun_uninstall_owner_container_id }}
  register: gluetun_uninstall_owner_container_inspect_result
  changed_when: false

- name: Validate and record the exact Gluetun owner inspection before removal
  when: gluetun_uninstall_owner_container_id | length > 0
  vars:
    gluetun_uninstall_owner_container_inspect_fields: "{{ gluetun_uninstall_owner_container_inspect_result.stdout.split('|') }}"
  ansible.builtin.assert:
    that:
      - gluetun_uninstall_owner_container_inspect_fields | length == 6
      - gluetun_uninstall_owner_container_inspect_fields[0] == gluetun_uninstall_owner_container_id
      - gluetun_uninstall_owner_container_inspect_fields[1] == '/' + gluetun_identifier
      - gluetun_uninstall_owner_container_inspect_fields[2] in ['true', 'false']
      - >-
        gluetun_uninstall_owner_container_inspect_fields[3] == ''
        or
        gluetun_uninstall_owner_container_inspect_fields[3] is match('^[a-f0-9]{64}$')
      - >-
        gluetun_uninstall_owner_container_inspect_fields[4]
        == gluetun_container_owner_label_value
      - >-
        gluetun_uninstall_owner_container_inspect_fields[5]
        in [
          '',
          '<no value>',
          gluetun_container_fail_closed_contract_label_value
        ]
    fail_msg: >-
      The exact Gluetun owner is malformed or lacks the role-owned identity
      label. It was not made a stop or removal target.

- name: Record the Gluetun owner sandbox before removal
  when: gluetun_uninstall_owner_container_id | length > 0
  vars:
    gluetun_uninstall_owner_container_inspect_fields: "{{ gluetun_uninstall_owner_container_inspect_result.stdout.split('|') }}"
  ansible.builtin.set_fact:
    gluetun_uninstall_owner_sandbox_id: "{{ gluetun_uninstall_owner_container_inspect_fields[3] }}"

- name: Query all running containers before Gluetun owner removal
  when: gluetun_uninstall_owner_container_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
  register: gluetun_uninstall_running_container_query_result
  changed_when: false

- name: Validate running container IDs before Gluetun owner removal
  when: gluetun_uninstall_owner_container_id | length > 0
  ansible.builtin.assert:
    that:
      - item is match('^[a-f0-9]{64}$')
    fail_msg: A running-container query returned a malformed identity.
  loop: "{{ gluetun_uninstall_running_container_query_result.stdout_lines | default([]) }}"

- name: Inspect running containers before Gluetun owner removal
  when: gluetun_uninstall_owner_container_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container inspect
      --format={% raw %}{{.Id}}|{{.State.Running}}|{{.HostConfig.NetworkMode}}|{{.NetworkSettings.SandboxID}}|{{.Name}}{% endraw %}
      {{ item }}
  loop: "{{ gluetun_uninstall_running_container_query_result.stdout_lines | default([]) }}"
  register: gluetun_uninstall_running_container_inspect_results
  changed_when: false

- name: Validate running-container inspections before Gluetun owner removal
  vars:
    gluetun_uninstall_running_container_inspect_fields: "{{ item.stdout.split('|') }}"
  ansible.builtin.assert:
    that:
      - gluetun_uninstall_running_container_inspect_fields | length == 5
      - gluetun_uninstall_running_container_inspect_fields[0] == item.item
      - gluetun_uninstall_running_container_inspect_fields[1] == 'true'
      - >-
        gluetun_uninstall_running_container_inspect_fields[3] == ''
        or
        gluetun_uninstall_running_container_inspect_fields[3] is match('^[a-f0-9]{64}$')
      - gluetun_uninstall_running_container_inspect_fields[4] is match('^/[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
    fail_msg: A running-container namespace inspection was malformed.
  loop: "{{ gluetun_uninstall_running_container_inspect_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Record running containers sharing the Gluetun namespace before removal
  vars:
    gluetun_uninstall_running_container_inspect_fields: "{{ item.stdout.split('|') }}"
    gluetun_uninstall_running_container_namespace_reference: >-
      {{
        gluetun_uninstall_running_container_inspect_fields[2]
        | regex_replace('^container:', '')
      }}
  ansible.builtin.set_fact:
    gluetun_uninstall_running_namespace_consumers_list: >-
      {{
        gluetun_uninstall_running_namespace_consumers_list
        + [
          {
            'container_id': gluetun_uninstall_running_container_inspect_fields[0],
            'container_name': gluetun_uninstall_running_container_inspect_fields[4]
          }
        ]
      }}
  when:
    - gluetun_uninstall_owner_container_id | length > 0
    - gluetun_uninstall_running_container_inspect_fields[0] != gluetun_uninstall_owner_container_id
    - >-
      (
        gluetun_uninstall_running_container_inspect_fields[2]
        == 'container:' + gluetun_uninstall_owner_container_id
      )
      or
      (
        gluetun_uninstall_running_container_inspect_fields[2]
        == 'container:' + gluetun_identifier
      )
      or
      (
        gluetun_uninstall_running_container_inspect_fields[2].startswith('container:')
        and gluetun_uninstall_running_container_namespace_reference | length >= 12
        and gluetun_uninstall_owner_container_id.startswith(gluetun_uninstall_running_container_namespace_reference)
      )
      or
      (
        gluetun_uninstall_owner_sandbox_id | length > 0
        and gluetun_uninstall_running_container_inspect_fields[3]
        == gluetun_uninstall_owner_sandbox_id
      )
  loop: "{{ gluetun_uninstall_running_container_inspect_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Refuse Gluetun owner removal while a namespace consumer remains
  ansible.builtin.assert:
    that:
      - gluetun_uninstall_running_namespace_consumers_list | length == 0
    fail_msg: >-
      A running unknown or unconfigured container still shares the Gluetun
      network namespace; the owner was retained.

- name: Quiesce the Gluetun owner before uninstall
  vars:
    gluetun_quiesce_owner_id: "{{ gluetun_uninstall_owner_container_id }}"
    gluetun_quiesce_owner_authorized: >-
      {{ gluetun_uninstall_owner_container_id | length > 0 }}
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/quiesce.yml"

- name: Directly stop the exact Gluetun owner container without a unit
  when:
    - gluetun_uninstall_owner_container_id | length > 0
    - not gluetun_existing_unit_stat.stat.exists | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - stop
      - --time
      - "{{ gluetun_container_stop_grace_time_seconds | string }}"
      - "{{ gluetun_uninstall_owner_container_id }}"
  register: gluetun_direct_owner_stop_result
  changed_when: gluetun_direct_owner_stop_result.rc == 0
  failed_when: false

- name: Directly remove the exact Gluetun owner container
  when: gluetun_uninstall_owner_container_id | length > 0
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - rm
      - --force
      - "{{ gluetun_uninstall_owner_container_id }}"
  register: gluetun_direct_owner_removal_result
  changed_when: gluetun_direct_owner_removal_result.rc == 0
  failed_when: false

- name: Prove the Gluetun systemd service is inactive or absent
  ansible.builtin.command:
    argv:
      - "{{ gluetun_systemd_systemctl_command }}"
      - is-active
      - "{{ gluetun_identifier }}.service"
  register: gluetun_uninstall_owner_unit_query_result
  changed_when: false
  failed_when: false

- name: Prove the exact-name Gluetun owner container is absent
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --all --no-trunc --quiet
      --filter 'name=^/{{ gluetun_identifier | regex_escape }}$'
  register: gluetun_uninstall_owner_post_removal_query_result
  changed_when: false

- name: Prove the originally resolved Gluetun owner ID is absent
  when: gluetun_uninstall_owner_container_id | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --all --no-trunc --quiet
      --filter id={{ gluetun_uninstall_owner_container_id }}
  register: gluetun_uninstall_owner_id_post_removal_query_result
  changed_when: false

- name: Require proven Gluetun owner shutdown and container absence
  ansible.builtin.assert:
    that:
      - gluetun_uninstall_owner_unit_query_result.rc in [3, 4]
      - gluetun_uninstall_owner_unit_query_result.stdout | trim in ['inactive', 'failed', 'unknown']
      - gluetun_uninstall_owner_post_removal_query_result.stdout | trim | length == 0
      - >-
        gluetun_uninstall_owner_container_id | length == 0
        or
        gluetun_uninstall_owner_id_post_removal_query_result.stdout | trim | length == 0
    fail_msg: >-
      The Gluetun owner unit is not inactive or its container is not absent;
      refusing further removal.

- name: Revalidate Gluetun application-data paths before file removal
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_paths.yml"

- name: Ensure Gluetun systemd service does not exist
  ansible.builtin.file:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service"
    state: absent
  register: gluetun_systemd_service_removal_result

- name: Reload systemd after removing the Gluetun service
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: gluetun_systemd_service_removal_result.changed | bool

- name: Release Gluetun uninstall quiescing after unit removal
  vars:
    gluetun_quiesce_release_final_unit_expected: false
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/release_quiesce.yml"

- name: Ensure Gluetun non-secret support files do not exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ gluetun_environment_file_path }}"
    - "{{ gluetun_companion_resolv_conf_path }}"
    - "{{ gluetun_container_helper_path }}"

- name: Ensure Gluetun managed secret files do not exist
  ansible.builtin.file:
    path: "{{ gluetun_secrets_path }}/{{ item }}"
    state: absent
  loop:
    - openvpn_clientcrt
    - openvpn_clientkey
    - openvpn_custom_config
    - openvpn_encrypted_key
    - openvpn_key_passphrase
    - openvpn_password
    - openvpn_user
    - control-server-auth.toml
    - wg0.conf
    - wireguard_addresses
    - wireguard_preshared_key
    - wireguard_private_key
  no_log: true
  diff: false

- name: Remove empty Gluetun secrets path
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - "{{ gluetun_secrets_path }}"
  register: gluetun_secrets_path_deletion_result
  changed_when: gluetun_secrets_path_deletion_result.rc == 0
  failed_when: false

- name: Safely remove the Gluetun container network
  when: gluetun_container_network_deletion_enabled | bool
  block:
    - name: Query the exact Gluetun container network name for removal
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network ls --no-trunc --quiet
          --filter 'name=^{{ gluetun_container_network | regex_escape }}$'
      register: gluetun_uninstall_network_query_result
      changed_when: false

    - name: Validate the exact Gluetun network query for removal
      ansible.builtin.assert:
        that:
          - >-
            gluetun_uninstall_network_query_result.stdout | trim | length == 0
            or
            (
              gluetun_uninstall_network_query_result.stdout_lines | length == 1
              and
              gluetun_uninstall_network_query_result.stdout_lines[0]
              is match('^[a-f0-9]{64}$')
            )
        fail_msg: The exact Gluetun network query was ambiguous; the network was retained.

    - name: Record the exact Gluetun network ID for removal
      ansible.builtin.set_fact:
        gluetun_uninstall_network_id: "{{ gluetun_uninstall_network_query_result.stdout_lines[0] }}"
      when: gluetun_uninstall_network_query_result.stdout_lines | length == 1

    - name: Inspect Gluetun network ownership metadata before removal
      when: gluetun_uninstall_network_id | length > 0
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network inspect
          --format='{% raw %}{{.Id}}|{{.Name}}|{{.Driver}}|{{.EnableIPv6}}|{{index .Labels "io.mash.gluetun.owner"}}{% endraw %}'
          {{ gluetun_uninstall_network_id }}
      register: gluetun_uninstall_network_metadata_result
      changed_when: false

    - name: Require exact Gluetun network ownership before removal
      when: gluetun_uninstall_network_id | length > 0
      vars:
        gluetun_uninstall_network_metadata_fields: "{{ gluetun_uninstall_network_metadata_result.stdout.split('|') }}"
      ansible.builtin.assert:
        that:
          - gluetun_uninstall_network_metadata_fields | length == 5
          - gluetun_uninstall_network_metadata_fields[0] == gluetun_uninstall_network_id
          - gluetun_uninstall_network_metadata_fields[1] == gluetun_container_network
          - gluetun_uninstall_network_metadata_fields[2] == 'bridge'
          - gluetun_uninstall_network_metadata_fields[3] == 'false'
          - >-
            gluetun_uninstall_network_metadata_fields[4]
            == gluetun_container_network_owner_label_value
        fail_msg: >-
          The exact-name network is not an owned Gluetun IPv4 bridge and was
          retained without disconnection or deletion.

    - name: Inspect remaining Gluetun network endpoints before removal
      when: gluetun_uninstall_network_id | length > 0
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network inspect
          --format='{% raw %}{{range .Containers}}{{println .Name}}{{end}}{% endraw %}'
          {{ gluetun_uninstall_network_id }}
      register: gluetun_uninstall_network_remaining_endpoints_result
      changed_when: false

    - name: Report safely retained Gluetun network with remaining endpoints
      when:
        - gluetun_uninstall_network_id | length > 0
        - gluetun_uninstall_network_remaining_endpoints_result.stdout_lines | length > 0
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: |
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              "Warning: owned Gluetun network `" + gluetun_container_network
              + "` was retained because endpoints remain. This role never "
              + "disconnects another container during uninstall."
            ]
          }}

    - name: Remove the exact owned Gluetun network without forcing endpoints
      when:
        - gluetun_uninstall_network_id | length > 0
        - gluetun_uninstall_network_remaining_endpoints_result.stdout_lines | length == 0
      ansible.builtin.command:
        argv:
          - "{{ devture_systemd_docker_base_host_command_docker }}"
          - network
          - rm
          - "{{ gluetun_uninstall_network_id }}"
      register: gluetun_network_deletion_result
      changed_when: gluetun_network_deletion_result.rc == 0

    - name: Prove removed Gluetun network is explicitly absent
      when:
        - gluetun_uninstall_network_id | length > 0
        - gluetun_uninstall_network_remaining_endpoints_result.stdout_lines | length == 0
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network ls --no-trunc --quiet
          --filter 'name=^{{ gluetun_container_network | regex_escape }}$'
      register: gluetun_uninstall_network_post_removal_query_result
      changed_when: false

    - name: Require explicit Gluetun network absence after removal
      when:
        - gluetun_uninstall_network_id | length > 0
        - gluetun_uninstall_network_remaining_endpoints_result.stdout_lines | length == 0
      ansible.builtin.assert:
        that:
          - gluetun_uninstall_network_post_removal_query_result.stdout | trim | length == 0
        fail_msg: The owned Gluetun network was not proven absent after removal.

- name: Remove empty Gluetun data path
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - "{{ gluetun_data_path }}"
  register: gluetun_data_path_deletion_result
  changed_when: gluetun_data_path_deletion_result.rc == 0
  failed_when: false

- name: Remove empty Gluetun base path
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - "{{ gluetun_base_path }}"
  register: gluetun_base_path_deletion_result
  changed_when: gluetun_base_path_deletion_result.rc == 0
  failed_when: false

- name: Check existence of retained Gluetun data path
  ansible.builtin.stat:
    path: "{{ gluetun_data_path }}"
  register: gluetun_data_path_stat

- name: Report retained Gluetun state
  when: gluetun_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: Gluetun has been removed, but non-empty state remains in `"
          + gluetun_data_path
          + "`. Delete it manually only after verifying it is no longer needed."
        ]
      }}
