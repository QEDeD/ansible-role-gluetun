---
- name: Validate Gluetun cleanup collections
  ansible.builtin.assert:
    that:
      - gluetun_protected_consumers_list | type_debug == 'list'
      - gluetun_protected_consumers_list | length <= 1
      - gluetun_systemd_dependent_services_list | type_debug == 'list'
      - gluetun_systemd_dependent_services_list | length <= 1
      - gluetun_container_network_known_peer_containers_list | type_debug == 'list'
      - >-
        gluetun_systemd_dependent_services_list | unique | length
        == gluetun_systemd_dependent_services_list | length
      - >-
        gluetun_container_network_known_peer_containers_list | unique | length
        == gluetun_container_network_known_peer_containers_list | length
      - gluetun_identifier is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - gluetun_container_network is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - >-
        gluetun_systemd_dependent_services_list
        ==
        gluetun_protected_consumers_list
        | map(attribute='systemd_service_name')
        | list
    fail_msg: Gluetun cleanup settings have an invalid type, value, or format.

- name: Validate protected-consumer identities for cleanup
  ansible.builtin.assert:
    that:
      - item | type_debug == 'dict'
      - item.keys() | sort == ['container_name', 'systemd_service_name']
      - item.container_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item.container_name != gluetun_identifier
      - item.systemd_service_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$')
      - item.systemd_service_name != gluetun_identifier + '.service'
    fail_msg: A Gluetun protected-consumer identity is unsafe for cleanup.
  loop: "{{ gluetun_protected_consumers_list }}"

- name: Validate protected-service systemd unit names for cleanup
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.@-]*\.service$')
      - item != gluetun_identifier + '.service'
    fail_msg: A Gluetun protected-service unit name is unsafe for cleanup.
  loop: "{{ gluetun_systemd_dependent_services_list }}"

- name: Validate known network peer names for cleanup
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - item != gluetun_identifier
    fail_msg: A Gluetun known network peer name is unsafe for cleanup.
  loop: "{{ gluetun_container_network_known_peer_containers_list }}"

- name: Check configured protected-service systemd units
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ item }}"
  loop: "{{ gluetun_systemd_dependent_services_list }}"
  register: gluetun_dependent_service_stats

- name: Stop configured protected services before removing Gluetun
  ansible.builtin.service:
    name: "{{ item.item }}"
    state: stopped
  loop: "{{ gluetun_dependent_service_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | bool

- name: Stop configured protected consumer containers before removing Gluetun
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container stop
      --time {{ gluetun_container_stop_grace_time_seconds }}
      {{ item.container_name }}
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_protected_consumer_uninstall_stop_results
  changed_when: gluetun_protected_consumer_uninstall_stop_results.rc == 0
  failed_when: false

- name: Prove protected consumer containers are stopped or absent before removing Gluetun
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }}
      container ls --no-trunc --quiet
      --filter name=^/{{ item.container_name | regex_escape }}$
  loop: "{{ gluetun_protected_consumers_list }}"
  loop_control:
    label: "{{ item.container_name }}"
  register: gluetun_protected_consumer_uninstall_query_results
  changed_when: false

- name: Fail unless protected consumer shutdown converged before removing Gluetun
  ansible.builtin.assert:
    that:
      - item.stdout_lines | length == 0
    fail_msg: >-
      Protected consumer `{{ item.item.container_name }}` is still running;
      refusing to remove the Gluetun owner.
  loop: "{{ gluetun_protected_consumer_uninstall_query_results.results }}"
  loop_control:
    label: "{{ item.item.container_name }}"

- name: Check existence of Gluetun systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service"
  register: gluetun_service_stat

- name: Ensure Gluetun systemd service is stopped
  when: gluetun_service_stat.stat.exists | bool
  ansible.builtin.service:
    name: "{{ gluetun_identifier }}"
    state: stopped
    enabled: false
    daemon_reload: true

- name: Ensure Gluetun systemd service does not exist
  ansible.builtin.file:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ gluetun_identifier }}.service"
    state: absent

- name: Ensure Gluetun non-secret support files do not exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ gluetun_environment_file_path }}"
    - "{{ gluetun_companion_resolv_conf_path }}"

- name: Ensure Gluetun managed secret files do not exist
  ansible.builtin.file:
    path: "{{ gluetun_secrets_path }}/{{ item }}"
    state: absent
  loop:
    - openvpn_clientcrt
    - openvpn_clientkey
    - openvpn_custom_config
    - openvpn_encrypted_key
    - openvpn_key_passphrase
    - openvpn_password
    - openvpn_user
    - wg0.conf
    - wireguard_addresses
    - wireguard_preshared_key
    - wireguard_private_key
  no_log: true
  diff: false

- name: Remove empty Gluetun secrets path
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ gluetun_secrets_path }}"
  register: gluetun_secrets_path_deletion_result
  changed_when: gluetun_secrets_path_deletion_result.rc == 0
  failed_when: false

- name: Safely remove the Gluetun container network
  when: gluetun_container_network_deletion_enabled | bool
  block:
    - name: Disconnect explicitly configured known Gluetun network peers
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network disconnect
          {{ gluetun_container_network }}
          {{ item }}
      loop: "{{ gluetun_container_network_known_peer_containers_list }}"
      register: gluetun_known_peer_disconnection_result
      changed_when: gluetun_known_peer_disconnection_result.rc == 0
      failed_when: false

    - name: Attempt to remove the Gluetun container network without forcing endpoints
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network rm
          {{ gluetun_container_network }}
      register: gluetun_network_deletion_result
      changed_when: gluetun_network_deletion_result.rc == 0
      failed_when: false

    - name: Check whether the Gluetun container network remains
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }}
          network inspect
          {{ gluetun_container_network }}
      register: gluetun_network_post_deletion_inspect_result
      changed_when: false
      failed_when: false

    - name: Report retained non-converged Gluetun container network
      when: gluetun_network_post_deletion_inspect_result.rc == 0
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: |
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              "Warning: Gluetun network `" + gluetun_container_network + "` was retained. "
              + "Only explicitly configured known peers are disconnected; an unknown endpoint "
              + "or another Docker error prevented safe network removal."
            ]
          }}

- name: Remove empty Gluetun data path
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ gluetun_data_path }}"
  register: gluetun_data_path_deletion_result
  changed_when: gluetun_data_path_deletion_result.rc == 0
  failed_when: false

- name: Remove empty Gluetun base path
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ gluetun_base_path }}"
  register: gluetun_base_path_deletion_result
  changed_when: gluetun_base_path_deletion_result.rc == 0
  failed_when: false

- name: Check existence of retained Gluetun data path
  ansible.builtin.stat:
    path: "{{ gluetun_data_path }}"
  register: gluetun_data_path_stat

- name: Report retained Gluetun state
  when: gluetun_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: Gluetun has been removed, but non-empty state remains in `"
          + gluetun_data_path
          + "`. Delete it manually only after verifying it is no longer needed."
        ]
      }}
